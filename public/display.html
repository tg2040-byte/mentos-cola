<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メントスコーラ - 表示機</title>
<style>
  :root {
    --bg: #060a12;
    --card: #121a2b;
    --accent: #ffce54;
    --accent2: #ff5a5a;
    --miss: #4a5568;
    --ok: #5ee6c8;
    --cola: #4a2a12;
    --cola-light: #7a4418;
    --text: #e8edf5;
    --text-dim: #8b96ab;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 0%, #10192c, var(--bg) 70%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 16px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; text-align: center; }
  .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 14px; text-align: center; }

  .lobby-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    max-width: 96vw;
  }

  .panel {
    background: rgba(18,26,43,0.7);
    border-radius: 22px;
    padding: 26px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .room-code { font-size: 84px; font-weight: 800; letter-spacing: 14px; color: var(--accent); margin: 8px 0; }
  .hint { color: var(--text-dim); font-size: 15px; }

  .name-row { margin-top: 20px; }
  .name-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .name-row input {
    width: 240px; padding: 12px 14px; border-radius: 12px; border: 2px solid #2a3650;
    background: #0e1420; color: var(--text); font-size: 16px; text-align: center;
  }

  .diff-row { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
  .diff-btn {
    padding: 12px 20px; border-radius: 14px; border: 2px solid #2a3650;
    background: #1b2536; color: var(--text); font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .diff-btn.selected { border-color: var(--accent); background: #2a2410; color: var(--accent); }

  .start-btn {
    margin-top: 20px; padding: 16px 44px; font-size: 19px; font-weight: 800;
    border: none; border-radius: 999px; background: var(--accent2); color: #300; cursor: pointer;
  }
  .start-btn:disabled { opacity: 0.35; cursor: default; }

  .leaderboard-panel {
    background: rgba(18,26,43,0.7);
    border-radius: 22px;
    padding: 20px 24px;
    width: 280px;
    max-height: 70vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .leaderboard-panel h2 { font-size: 15px; margin: 0 0 12px; color: var(--accent); }
  .lb-diff-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .lb-diff-tab {
    flex: 1; padding: 6px 0; font-size: 11px; border-radius: 8px; border: 1px solid #2a3650;
    background: #1b2536; color: var(--text-dim); cursor: pointer; text-align: center;
  }
  .lb-diff-tab.selected { border-color: var(--accent); color: var(--accent); }
  .lb-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .lb-list li {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 7px 0; border-bottom: 1px solid #1b2536; color: var(--text);
  }
  .lb-list li .rank { color: var(--text-dim); width: 20px; flex-shrink: 0; }
  .lb-list li .lb-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-list li .lb-time { color: var(--ok); font-weight: 700; }
  .lb-empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 12px 0; }

  .stage-wrap { display: none; flex-direction: column; align-items: center; width: 100%; }
  .countdown-num {
    font-size: 140px; font-weight: 900; color: var(--accent);
    text-shadow: 0 0 60px rgba(255,206,84,0.5); position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5;
  }

  .field {
    position: relative;
    width: min(94vw, 720px);
    height: min(58vh, 500px);
    border-radius: 20px;
    background: linear-gradient(180deg, #0c1120 0%, #131b2d 70%, #1a2334 100%);
    border: 2px solid #202b42;
    overflow: hidden;
  }
  canvas#particleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  .origin-mark {
    position: absolute;
    bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 34px;
  }

  .target {
    position: absolute;
    transform: translate(-50%, 50%);
    display: flex; flex-direction: column; align-items: center;
    transition: left 0.25s ease, bottom 0.25s ease;
  }
  .glass {
    width: 54px; height: 62px;
    border-radius: 8px 8px 18px 18px;
    border: 3px solid #3a4a68;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0) 30%), #1a2334;
    overflow: hidden;
    position: relative;
  }
  .glass .glass-liquid {
    position: absolute; bottom: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(180deg, var(--cola-light), var(--cola));
  }
  .target-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .mentos-fly {
    position: absolute;
    font-size: 26px;
    transform: translate(-50%, 50%);
    z-index: 3;
    display: none;
  }

  .splat {
    position: absolute;
    font-size: 30px;
    transform: translate(-50%, 50%);
    z-index: 3;
    opacity: 0;
  }

  .hud-row { display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .hud-chip {
    background: #121a2b; border-radius: 12px; padding: 8px 16px; font-size: 13px; color: var(--text-dim);
  }
  .hud-chip b { color: var(--text); font-size: 15px; }
  .hud-chip.timer b { color: var(--ok); font-variant-numeric: tabular-nums; }

  .miss-flash {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 800; color: var(--accent2);
    background: rgba(6,10,18,0.85); padding: 6px 16px; border-radius: 999px;
    opacity: 0; transition: opacity 0.2s; z-index: 6;
  }
  .miss-flash.show { opacity: 1; }

  .result-box { display: none; flex-direction: column; align-items: center; margin-top: 10px; }
  .result-tier { font-size: 34px; font-weight: 900; }
  .result-score { font-size: 15px; color: var(--text-dim); margin-top: 4px; }
  .retry-btn {
    margin-top: 14px; padding: 14px 34px; font-size: 16px; font-weight: 700;
    border: none; border-radius: 999px; background: var(--accent); color: #332200; cursor: pointer;
  }

  .status-line { margin-top: 10px; font-size: 13px; color: var(--text-dim); }
</style>
</head>
<body>

  <div class="lobby-layout" id="lobbyLayout">
    <div class="panel" id="lobbyPanel">
      <h1>🍬 メントスコーラ「投げ込め！」タイムアタック</h1>
      <div class="sub">スマホでルームコードを入力して接続してください</div>
      <div class="room-code" id="roomCode">----</div>
      <div class="hint" id="lobbyHint">サーバーに接続中…</div>

      <div class="name-row" id="nameRow" style="display:none;">
        <label for="playerName">挑戦者の名前</label>
        <input id="playerName" type="text" maxlength="20" placeholder="なまえ" />
      </div>

      <div class="diff-row" id="diffRow" style="display:none;">
        <button class="diff-btn selected" data-diff="easy">かんたん</button>
        <button class="diff-btn" data-diff="normal">ふつう</button>
        <button class="diff-btn" data-diff="hard">むずかしい</button>
      </div>
      <button class="start-btn" id="startBtn" style="display:none;">▶ タイムアタック開始</button>
    </div>

    <div class="leaderboard-panel">
      <h2>🏆 挑戦者ランキング</h2>
      <div class="lb-diff-tabs">
        <div class="lb-diff-tab selected" data-diff="easy">かんたん</div>
        <div class="lb-diff-tab" data-diff="normal">ふつう</div>
        <div class="lb-diff-tab" data-diff="hard">むずかしい</div>
      </div>
      <ul class="lb-list" id="lbList"><li class="lb-empty" style="display:list-item;">まだ記録がありません</li></ul>
    </div>
  </div>

  <div class="stage-wrap" id="stageWrap">
    <div class="countdown-num" id="countdownNum" style="display:none;"></div>

    <div class="field" id="field">
      <canvas id="particleCanvas"></canvas>
      <div class="miss-flash" id="missFlash">💦 はずれ！もう一度！</div>
      <div class="origin-mark">🤾</div>
      <div class="target" id="target">
        <div class="glass"><div class="glass-liquid"></div></div>
        <div class="target-label" id="targetLabel">コーラ</div>
      </div>
      <div class="mentos-fly" id="mentosFly">🍬</div>
      <div class="splat" id="splat">💦</div>
    </div>

    <div class="hud-row" id="hudRow" style="display:none;">
      <div class="hud-chip">挑戦者 <b id="nameChip">-</b></div>
      <div class="hud-chip">難易度 <b id="diffChip">-</b></div>
      <div class="hud-chip">投球数 <b id="attemptChip">0</b></div>
      <div class="hud-chip timer">タイム <b id="timerChip">0.00</b></div>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-tier" id="resultTier"></div>
      <div class="result-score" id="resultScore"></div>
      <button class="retry-btn" id="retryBtn">👉 次の挑戦者へ</button>
    </div>
  </div>

  <div class="status-line" id="statusLine"></div>

<script>
  const lobbyLayout = document.getElementById('lobbyLayout');
  const roomCodeEl = document.getElementById('roomCode');
  const lobbyHint = document.getElementById('lobbyHint');
  const lobbyPanel = document.getElementById('lobbyPanel');
  const nameRow = document.getElementById('nameRow');
  const playerNameInput = document.getElementById('playerName');
  const diffRow = document.getElementById('diffRow');
  const startBtn = document.getElementById('startBtn');
  const stageWrap = document.getElementById('stageWrap');
  const countdownNum = document.getElementById('countdownNum');
  const field = document.getElementById('field');
  const targetEl = document.getElementById('target');
  const targetLabel = document.getElementById('targetLabel');
  const mentosFly = document.getElementById('mentosFly');
  const splat = document.getElementById('splat');
  const missFlash = document.getElementById('missFlash');
  const hudRow = document.getElementById('hudRow');
  const nameChip = document.getElementById('nameChip');
  const diffChip = document.getElementById('diffChip');
  const attemptChip = document.getElementById('attemptChip');
  const timerChip = document.getElementById('timerChip');
  const resultBox = document.getElementById('resultBox');
  const resultTier = document.getElementById('resultTier');
  const resultScore = document.getElementById('resultScore');
  const retryBtn = document.getElementById('retryBtn');
  const statusLine = document.getElementById('statusLine');
  const lbList = document.getElementById('lbList');

  // ---- 難易度プリセット（距離比率・左右オフセット比率・的の許容半径px） ----
  // ※ 実プレイのフィードバックを受けて、命中しやすいよう許容半径を広め・ばらつきを小さめに調整済み
  const DIFFICULTIES = {
    easy:   { label: 'かんたん',   distanceRatio: 0.32, offsetRatio: 0.00,  hitRadius: 110, jitterD: 0.02, jitterO: 0.03 },
    normal: { label: 'ふつう',     distanceRatio: 0.58, offsetRatio: 0.25,  hitRadius: 78,  jitterD: 0.03, jitterO: 0.05 },
    hard:   { label: 'むずかしい', distanceRatio: 0.85, offsetRatio: -0.42, hitRadius: 50,  jitterD: 0.03, jitterO: 0.05 },
  };

  // ---- 投球パワー/方向 → ステージ座標への変換係数（実機での振りの強さに合わせて要調整） ----
  const POWER_FULL = 55;       // このスイングパワーで最大飛距離に到達する目安
  const DIR_FULL = 18;         // 加速度x成分がこの値で画面端まで振れる目安
  const DIR_TO_OFFSET_RATIO = 1.0;

  let selectedDifficulty = 'easy';
  let lbFilterDifficulty = 'easy';
  let latestLeaderboard = [];

  diffRow.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      diffRow.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedDifficulty = btn.dataset.diff;
    });
  });

  document.querySelectorAll('.lb-diff-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.lb-diff-tab').forEach(t => t.classList.remove('selected'));
      tab.classList.add('selected');
      lbFilterDifficulty = tab.dataset.diff;
      renderLeaderboard();
    });
  });

  function renderLeaderboard() {
    const filtered = latestLeaderboard
      .filter(e => e.difficulty === lbFilterDifficulty)
      .slice()
      .sort((a, b) => a.timeMs - b.timeMs)
      .slice(0, 10);

    if (filtered.length === 0) {
      lbList.innerHTML = '<li class="lb-empty" style="display:list-item;">まだ記録がありません</li>';
      return;
    }
    lbList.innerHTML = filtered.map((e, i) => `
      <li>
        <span class="rank">${i + 1}</span>
        <span class="lb-name">${escapeHtml(e.name)}</span>
        <span class="lb-time">${(e.timeMs / 1000).toFixed(2)}s</span>
      </li>
    `).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);

  ws.addEventListener('open', () => { ws.send(JSON.stringify({ type: 'create_room' })); });
  ws.addEventListener('close', () => { statusLine.textContent = 'サーバーとの接続が切れました。ページを再読み込みしてください。'; });

  ws.addEventListener('message', (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'room_created') {
      roomCodeEl.textContent = msg.code;
      lobbyHint.textContent = 'スマホの投球機でこのコードを入力してください';
    } else if (msg.type === 'controller_joined') {
      lobbyHint.textContent = '📱 スマホが接続しました！名前と難易度を選んでスタート';
      nameRow.style.display = 'block';
      diffRow.style.display = 'flex';
      startBtn.style.display = 'inline-block';
    } else if (msg.type === 'round_start') {
      runRound(msg.startAt, msg.difficulty, msg.name);
    } else if (msg.type === 'throw_received') {
      handleThrow(msg.power, msg.dirX);
    } else if (msg.type === 'leaderboard_update') {
      latestLeaderboard = msg.leaderboard || [];
      renderLeaderboard();
    } else if (msg.type === 'peer_disconnected') {
      statusLine.textContent = 'スマホとの接続が切れました。もう一度接続してください。';
    }
  });

  startBtn.addEventListener('click', () => {
    const name = (playerNameInput.value || '').trim().slice(0, 20) || '名無し';
    ws.send(JSON.stringify({ type: 'request_start', difficulty: selectedDifficulty, name }));
    startBtn.disabled = true;
  });
  retryBtn.addEventListener('click', () => {
    ws.send(JSON.stringify({ type: 'new_challenger' }));
    resetToLobby();
  });

  function resetToLobby() {
    lobbyLayout.style.display = 'flex';
    stageWrap.style.display = 'none';
    resultBox.style.display = 'none';
    hudRow.style.display = 'none';
    mentosFly.style.display = 'none';
    splat.style.opacity = 0;
    startBtn.disabled = false;
    playerNameInput.value = '';
    nameRow.style.display = 'none';
    diffRow.style.display = 'none';
    startBtn.style.display = 'none';
    lobbyHint.textContent = 'スマホの投球機でこのコードを入力してください';
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ---- 座標系ヘルパー ----
  function fieldRect() { return field.getBoundingClientRect(); }
  function originPoint() {
    const r = fieldRect();
    return { x: r.width / 2, y: r.height - 30 };
  }
  function ratiosToPoint(distanceRatio, offsetRatio) {
    const r = fieldRect();
    const o = originPoint();
    const maxDist = r.height - 90;
    const maxOffset = (r.width / 2) - 50;
    return {
      x: o.x + offsetRatio * maxOffset,
      y: o.y - distanceRatio * maxDist,
    };
  }

  let currentTarget = null; // { point, hitRadius, difficulty }
  let currentName = '名無し';
  let attemptCount = 0;
  let roundStartedAt = 0;
  let timerRAF = null;

  function placeTarget(difficulty) {
    const preset = DIFFICULTIES[difficulty];
    const distanceRatio = clamp(preset.distanceRatio + (Math.random() - 0.5) * 2 * preset.jitterD, 0.15, 0.95);
    const offsetRatio = clamp(preset.offsetRatio + (Math.random() - 0.5) * 2 * preset.jitterO, -0.9, 0.9);
    const point = ratiosToPoint(distanceRatio, offsetRatio);
    const scale = 1 - distanceRatio * 0.35; // 遠いほど小さく描画（奥行き感）
    targetEl.style.left = point.x + 'px';
    targetEl.style.bottom = (fieldRect().height - point.y) + 'px';
    targetEl.style.transformOrigin = 'bottom center';
    targetEl.querySelector('.glass').style.transform = `scale(${scale})`;
    targetLabel.textContent = preset.label;
    currentTarget = { point, hitRadius: preset.hitRadius * (0.7 + scale * 0.3), difficulty };
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  function startTimerLoop() {
    function tick() {
      const elapsed = (performance.now() - roundStartedAt) / 1000;
      timerChip.textContent = elapsed.toFixed(2);
      timerRAF = requestAnimationFrame(tick);
    }
    timerRAF = requestAnimationFrame(tick);
  }
  function stopTimerLoop() {
    if (timerRAF) cancelAnimationFrame(timerRAF);
    timerRAF = null;
  }

  async function runRound(startAt, difficulty, name) {
    lobbyLayout.style.display = 'none';
    stageWrap.style.display = 'flex';
    resultBox.style.display = 'none';
    hudRow.style.display = 'none';
    mentosFly.style.display = 'none';
    splat.style.opacity = 0;
    missFlash.classList.remove('show');
    currentName = name || '名無し';
    nameChip.textContent = currentName;
    diffChip.textContent = DIFFICULTIES[difficulty].label;
    attemptCount = 0;
    attemptChip.textContent = '0';
    timerChip.textContent = '0.00';
    countdownNum.style.display = 'block';

    resizeCanvas();
    placeTarget(difficulty);

    const delay = startAt - Date.now();
    await sleep(Math.max(0, delay));

    for (const n of ['3', '2', '1', '投げろ！']) {
      countdownNum.textContent = n;
      await sleep(650);
    }
    countdownNum.style.display = 'none';
    hudRow.style.display = 'flex';
    roundStartedAt = performance.now();
    startTimerLoop();
  }

  async function handleThrow(power, dirX) {
    attemptCount++;
    attemptChip.textContent = String(attemptCount);

    const o = originPoint();
    const distanceRatioThrow = clamp(power / POWER_FULL, 0, 1.15);
    const offsetRatioThrow = clamp((dirX / DIR_FULL) * DIR_TO_OFFSET_RATIO, -1.1, 1.1);
    const landing = ratiosToPoint(distanceRatioThrow, offsetRatioThrow);

    await animateMentos(o, landing);

    const dx = landing.x - currentTarget.point.x;
    const dy = landing.y - currentTarget.point.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const hit = dist <= currentTarget.hitRadius;

    if (hit) {
      stopTimerLoop();
      const finalElapsedMs = performance.now() - roundStartedAt;
      timerChip.textContent = (finalElapsedMs / 1000).toFixed(2);

      launchEruption(currentTarget.point, power);
      ws.send(JSON.stringify({ type: 'throw_result', result: 'hit', elapsedMs: Math.round(finalElapsedMs) }));
      ws.send(JSON.stringify({
        type: 'submit_score',
        name: currentName,
        timeMs: Math.round(finalElapsedMs),
        difficulty: currentTarget.difficulty,
      }));

      await sleep(500);
      resultTier.textContent = `🎉 ${currentName}さん 命中！`;
      resultTier.style.color = 'var(--accent2)';
      resultScore.textContent = `記録: ${(finalElapsedMs / 1000).toFixed(2)}秒 / ${attemptCount}投 / 難易度: ${DIFFICULTIES[currentTarget.difficulty].label}`;
      resultBox.style.display = 'flex';
    } else {
      showSplat(landing);
      ws.send(JSON.stringify({ type: 'throw_result', result: 'miss' }));
      missFlash.classList.add('show');
      setTimeout(() => missFlash.classList.remove('show'), 600);
    }
  }

  function animateMentos(from, to) {
    return new Promise((resolve) => {
      mentosFly.style.display = 'block';
      const duration = 420;
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const ease = t; // 単純な線形（好みでイージングを変更可）
        const x = from.x + (to.x - from.x) * ease;
        // 放物線っぽい高さの盛り上がりを付与
        const arc = Math.sin(Math.PI * t) * 40;
        const y = from.y + (to.y - from.y) * ease - arc;
        mentosFly.style.left = x + 'px';
        mentosFly.style.bottom = (fieldRect().height - y) + 'px';
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          mentosFly.style.display = 'none';
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function showSplat(point) {
    splat.style.left = point.x + 'px';
    splat.style.bottom = (fieldRect().height - point.y) + 'px';
    splat.style.opacity = 1;
    splat.style.transform = 'translate(-50%, 50%) scale(0.6)';
    requestAnimationFrame(() => {
      splat.style.transition = 'transform 0.3s ease, opacity 0.6s ease 0.4s';
      splat.style.transform = 'translate(-50%, 50%) scale(1.3)';
    });
    setTimeout(() => { splat.style.opacity = 0; splat.style.transition = 'none'; }, 1000);
  }

  // --- 噴射パーティクル ---
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas() {
    const rect = fieldRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let particles = [];
  let animating = false;

  function launchEruption(targetPoint, power) {
    const score = 200 + power * 6; // 演出のにぎやかさに変換
    const count = Math.max(40, Math.min(240, Math.round(score * 0.35)));
    const powerVis = Math.max(5, Math.min(16, score / 60));
    const originX = targetPoint.x * devicePixelRatio;
    const originY = targetPoint.y * devicePixelRatio;

    for (let i = 0; i < count; i++) {
      const angle = (Math.random() - 0.5) * 1.0 - Math.PI / 2;
      const speed = powerVis * (0.5 + Math.random());
      particles.push({
        x: originX, y: originY,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 55 + Math.random() * 35, r: 2 + Math.random() * 3,
        color: Math.random() > 0.3 ? 'rgba(122,68,24,0.9)' : 'rgba(255,236,200,0.9)',
      });
    }
    if (!animating) { animating = true; requestAnimationFrame(stepParticles); }
  }

  function stepParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const gravity = 0.35 * devicePixelRatio;
    particles.forEach(p => {
      p.vy += gravity;
      p.x += p.vx * devicePixelRatio * 0.6;
      p.y += p.vy * devicePixelRatio * 0.6;
      p.life -= 1;
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      ctx.arc(p.x, p.y, p.r * devicePixelRatio, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0 && p.y < canvas.height + 60);

    if (particles.length > 0) requestAnimationFrame(stepParticles);
    else animating = false;
  }
</script>
</body>
</html>
